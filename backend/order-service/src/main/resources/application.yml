spring:
  application:
    name: order-service
  jpa:
    open-in-view: false
  datasource:
    hikari:
      maximum-pool-size: ${DB_POOL_MAX_SIZE:10}
      minimum-idle: ${DB_POOL_MIN_IDLE:2}
      connection-timeout: ${DB_CONNECTION_TIMEOUT_MS:3000}
  threads:
    virtual:
      enabled: true
  autoconfigure:
    # Secure HTTP only. order-service runs a gRPC server (OrderGrpcService); spring-grpc would
    # auto-secure it once spring-security is present (every call → UNAUTHENTICATED). gRPC is
    # internal and protected by the NetworkPolicy, so disable gRPC-layer security.
    exclude:
      - org.springframework.boot.grpc.server.autoconfigure.security.GrpcServerSecurityAutoConfiguration
      - org.springframework.boot.grpc.server.autoconfigure.security.GrpcServerOAuth2ResourceServerAutoConfiguration
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${KEYCLOAK_ISSUER_URI:http://localhost:8180/realms/robomart}
          audiences: ${KEYCLOAK_AUDIENCE:robomart-api}
          jwk-set-uri: ${KEYCLOAK_JWK_SET_URI:http://localhost:8180/realms/robomart/protocol/openid-connect/certs}
  flyway:
    enabled: true
    locations: classpath:db/migration
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:29092}
    properties:
      schema.registry.url: ${SCHEMA_REGISTRY_URL:http://localhost:8085}
      http.connect.timeout.ms: 1000
      http.read.timeout.ms: 5000
      max.retries: 0
    producer:
      acks: all
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: io.confluent.kafka.serializers.KafkaAvroSerializer
      properties:
        auto.register.schemas: true
        max.block.ms: 1000
        request.timeout.ms: 10000
        delivery.timeout.ms: 30000
    consumer:
      enable-auto-commit: false
      auto-offset-reset: earliest
      max-poll-records: 10
      key-deserializer: org.springframework.kafka.support.serializer.ErrorHandlingDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.ErrorHandlingDeserializer
      properties:
        spring.deserializer.key.delegate.class: org.apache.kafka.common.serialization.StringDeserializer
        spring.deserializer.value.delegate.class: io.confluent.kafka.serializers.KafkaAvroDeserializer
        specific.avro.reader: true
        max.poll.interval.ms: 600000
    admin:
      operation-timeout: 5s
      auto-create: ${spring.kafka.listener.auto-startup:true}
    template:
      observation-enabled: true
    listener:
      observation-enabled: true
  grpc:
    server:
      port: 9093
    client:
      channel:
        inventory-service:
          target: '${GRPC_CLIENT_INVENTORY_SERVICE_ADDRESS:static://localhost:9094}'
          ssl:
            enabled: false
        payment-service:
          target: '${GRPC_CLIENT_PAYMENT_SERVICE_ADDRESS:static://localhost:9095}'
          ssl:
            enabled: false
  lifecycle:
    timeout-per-shutdown-phase: 25s
  http:
    serviceclient:
      # Declarative ProductCatalogClient (@ImportHttpServices group) used to price orders server-side.
      product-service:
        base-url: ${robomart.product-service.url}
        connect-timeout: 2s
        read-timeout: 3s

robomart:
  product-service:
    url: ${PRODUCT_SERVICE_URL:http://localhost:8081}

saga:
  payment-recovery:
    enabled: true
    check-interval-ms: 5000
    initial-delay-ms: 5000
    retry-delay: 30s
    batch-size: 20
    max-age: 1h
    max-attempts: 120
  refund-recovery:
    max-age: 1h
    max-attempts: 12
  steps:
    default-timeout: 10s
    timeouts:
      # Keys must exactly match SagaStep.getName() return values
      ReserveInventory: 10s
      ProcessPayment: 10s
      ReleaseInventory: 10s
      RefundPaymentStep: 10s
  dead-saga-detection:
    enabled: true
    stuck-threshold: 5m
    check-interval-ms: 60000
    initial-delay-ms: 30000

logging:
  structured:
    format:
      console: ${LOGGING_STRUCTURED_FORMAT_CONSOLE:ecs}

server:
  port: 8083
  shutdown: graceful

management:
  tracing:
    baggage:
      remote-fields: correlationId,X-Correlation-Id
      correlation:
        fields: correlationId,X-Correlation-Id
    sampling:
      probability: ${TRACING_SAMPLE_RATE:1.0}
  opentelemetry:
    tracing:
      export:
        otlp:
          endpoint: ${MANAGEMENT_OPENTELEMETRY_TRACING_EXPORT_OTLP_ENDPOINT:http://localhost:4318/v1/traces}
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  health:
    probes:
      enabled: true
  endpoint:
    health:
      show-details: when-authorized
      group:
        liveness:
          include: livenessState
        readiness:
          include: readinessState,db,kafka
  metrics:
    distribution:
      percentiles-histogram:
        "[http.server.requests]": true
      percentiles:
        "[http.server.requests]": 0.5,0.95,0.99

resilience4j:
  circuitbreaker:
    # Outer breaker/fallback sees the final result of the inner retry.
    circuit-breaker-aspect-order: 1
    instances:
      inventory-service:
        sliding-window-type: COUNT_BASED
        sliding-window-size: 5
        failure-rate-threshold: 100
        minimum-number-of-calls: 5
        wait-duration-in-open-state: 30s
        permitted-number-of-calls-in-half-open-state: 1
        record-exceptions:
          - io.grpc.StatusRuntimeException
          - com.robomart.order.grpc.InventoryServiceUnavailableException
        # Business rejections (insufficient stock) are deterministic — never count them as failures.
        ignore-exceptions:
          - com.robomart.order.grpc.InventoryBusinessException
      payment-service:
        sliding-window-type: COUNT_BASED
        sliding-window-size: 5
        failure-rate-threshold: 100
        minimum-number-of-calls: 5
        wait-duration-in-open-state: 30s
        permitted-number-of-calls-in-half-open-state: 1
        record-exceptions:
          - io.grpc.StatusRuntimeException
          - com.robomart.order.grpc.PaymentServiceUnavailableException
        # Business rejections (payment declined) are deterministic — never count them as failures.
        ignore-exceptions:
          - com.robomart.order.grpc.PaymentBusinessException

---
spring:
  config:
    activate:
      on-profile: dev
  datasource:
    url: jdbc:postgresql://localhost:5434/order_db
    username: robomart
    password: robomart
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        format_sql: true

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  metrics:
    distribution:
      percentiles:
        "[http.server.requests]": 0.95

---
spring:
  config:
    activate:
      on-profile: demo
  flyway:
    locations: classpath:db/migration,classpath:db/seed

---
spring:
  config:
    activate:
      on-profile: test
  jpa:
    hibernate:
      ddl-auto: validate
  flyway:
    locations: classpath:db/migration,classpath:db/seed

management:
  endpoint:
    health:
      # Test context does not register the 'kafka' health contributor referenced by the
      # readiness group; skip group-membership validation so the context starts (matches
      # the shared @IntegrationTest meta-annotation used by other services).
      validate-group-membership: false

saga:
  payment-recovery:
    # Integration tests invoke the recovery service explicitly to control fault timing.
    enabled: false
