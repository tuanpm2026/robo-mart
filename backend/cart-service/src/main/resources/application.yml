spring:
  application:
    name: cart-service
  threads:
    virtual:
      enabled: true
  data:
    redis:
      repositories:
        enabled: false
      host: localhost
      port: 6379
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:29092}
    properties:
      schema.registry.url: ${SCHEMA_REGISTRY_URL:http://localhost:8085}
      http.connect.timeout.ms: 1000
      http.read.timeout.ms: 5000
      max.retries: 0
    producer:
      acks: all
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: io.confluent.kafka.serializers.KafkaAvroSerializer
      properties:
        auto.register.schemas: true
        max.block.ms: 1000
        request.timeout.ms: 10000
        delivery.timeout.ms: 30000
    consumer:
      enable-auto-commit: false
      auto-offset-reset: earliest
      max-poll-records: 10
      key-deserializer: org.springframework.kafka.support.serializer.ErrorHandlingDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.ErrorHandlingDeserializer
      properties:
        spring.deserializer.key.delegate.class: org.apache.kafka.common.serialization.StringDeserializer
        spring.deserializer.value.delegate.class: io.confluent.kafka.serializers.KafkaAvroDeserializer
        specific.avro.reader: true
        max.poll.interval.ms: 600000
    admin:
      operation-timeout: 5s
      auto-create: ${spring.kafka.listener.auto-startup:true}
    template:
      observation-enabled: true
    listener:
      observation-enabled: true
  lifecycle:
    timeout-per-shutdown-phase: 25s
  http:
    serviceclient:
      # @HttpExchange ProductServiceClient — prices/names are always looked up server-side
      product-service:
        base-url: ${robomart.product-service.url}
        connect-timeout: 2s
        read-timeout: 3s

logging:
  structured:
    format:
      console: ${LOGGING_STRUCTURED_FORMAT_CONSOLE:ecs}

server:
  port: 8082
  shutdown: graceful

robomart:
  cart:
    ttl-minutes: 1440
  product-service:
    url: ${PRODUCT_SERVICE_URL:http://localhost:8081}

notification:
  checkout-base-url: ${CHECKOUT_BASE_URL:http://localhost:5173/cart}

management:
  tracing:
    baggage:
      remote-fields: correlationId,X-Correlation-Id
      correlation:
        fields: correlationId,X-Correlation-Id
    sampling:
      probability: ${TRACING_SAMPLE_RATE:1.0}
  opentelemetry:
    tracing:
      export:
        otlp:
          endpoint: ${MANAGEMENT_OPENTELEMETRY_TRACING_EXPORT_OTLP_ENDPOINT:http://localhost:4318/v1/traces}
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  health:
    probes:
      enabled: true
  endpoint:
    health:
      show-details: when-authorized
      group:
        liveness:
          include: livenessState
        readiness:
          include: readinessState,redis,kafka
  metrics:
    distribution:
      percentiles-histogram:
        "[http.server.requests]": true
      percentiles:
        "[http.server.requests]": 0.5,0.95,0.99

---
spring:
  config:
    activate:
      on-profile: test
  data:
    redis:
      host: localhost
      port: 6379

---
spring:
  config:
    activate:
      on-profile: test
server:
  shutdown: immediate
management:
  otlp:
    metrics:
      export:
        enabled: false
