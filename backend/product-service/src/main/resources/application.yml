spring:
  application:
    name: product-service
  jpa:
    open-in-view: false
  datasource:
    hikari:
      maximum-pool-size: ${DB_POOL_MAX_SIZE:10}
      minimum-idle: ${DB_POOL_MIN_IDLE:2}
      connection-timeout: ${DB_CONNECTION_TIMEOUT_MS:3000}
  threads:
    virtual:
      enabled: true
  security:
    oauth2:
      resourceserver:
        jwt:
          # jwk-set-uri (lazy) so the app/tests start without Keycloak reachable.
          issuer-uri: ${KEYCLOAK_ISSUER_URI:http://localhost:8180/realms/robomart}
          audiences: ${KEYCLOAK_AUDIENCE:robomart-api}
          jwk-set-uri: ${KEYCLOAK_JWK_SET_URI:http://localhost:8180/realms/robomart/protocol/openid-connect/certs}
  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 52MB
  flyway:
    enabled: true
    locations: classpath:db/migration
  elasticsearch:
    connection-timeout: 1s
    socket-timeout: 2s
    uris: http://localhost:9200
  data:
    redis:
      host: localhost
      port: 6379
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:29092}
    properties:
      schema.registry.url: ${SCHEMA_REGISTRY_URL:http://localhost:8085}
      http.connect.timeout.ms: 1000
      http.read.timeout.ms: 5000
      max.retries: 0
    producer:
      acks: all
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: io.confluent.kafka.serializers.KafkaAvroSerializer
      properties:
        auto.register.schemas: true
        max.block.ms: 1000
        request.timeout.ms: 10000
        delivery.timeout.ms: 30000
    consumer:
      enable-auto-commit: false
      auto-offset-reset: earliest
      max-poll-records: 10
      key-deserializer: org.springframework.kafka.support.serializer.ErrorHandlingDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.ErrorHandlingDeserializer
      properties:
        spring.deserializer.key.delegate.class: org.apache.kafka.common.serialization.StringDeserializer
        spring.deserializer.value.delegate.class: io.confluent.kafka.serializers.KafkaAvroDeserializer
        specific.avro.reader: true
        max.poll.interval.ms: 600000
    admin:
      operation-timeout: 5s
      auto-create: ${spring.kafka.listener.auto-startup:true}
    template:
      observation-enabled: true
    listener:
      observation-enabled: true
  lifecycle:
    timeout-per-shutdown-phase: 25s

logging:
  structured:
    format:
      console: ${LOGGING_STRUCTURED_FORMAT_CONSOLE:ecs}

server:
  port: 8081
  shutdown: graceful

management:
  tracing:
    baggage:
      remote-fields: correlationId,X-Correlation-Id
      correlation:
        fields: correlationId,X-Correlation-Id
    sampling:
      probability: ${TRACING_SAMPLE_RATE:1.0}
  opentelemetry:
    tracing:
      export:
        otlp:
          endpoint: ${MANAGEMENT_OPENTELEMETRY_TRACING_EXPORT_OTLP_ENDPOINT:http://localhost:4318/v1/traces}
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  health:
    probes:
      enabled: true
  endpoint:
    health:
      show-details: when-authorized
      group:
        liveness:
          include: livenessState
        readiness:
          include: readinessState,db,redis,elasticsearch,kafka,productSearch
  metrics:
    distribution:
      percentiles-histogram:
        "[http.server.requests]": true
      percentiles:
        "[http.server.requests]": 0.5,0.95,0.99

robomart:
  product:
    image-storage-path: /tmp/robomart-images
    image-base-url: http://localhost:8081

---
spring:
  config:
    activate:
      on-profile: dev
  datasource:
    url: jdbc:postgresql://localhost:5432/product_db
    username: robomart
    password: robomart
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        format_sql: true

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  health:
    elasticsearch:
      enabled: false
  metrics:
    distribution:
      percentiles:
        "[http.server.requests]": 0.95

---
spring:
  config:
    activate:
      on-profile: demo
  flyway:
    locations: classpath:db/migration,classpath:db/seed

---
spring:
  config:
    activate:
      on-profile: test
  jpa:
    hibernate:
      ddl-auto: validate
  flyway:
    locations: classpath:db/migration,classpath:db/seed

---
spring:
  config:
    activate:
      on-profile: test
  kafka:
    listener:
      # Kafka delivery suites explicitly start/stop their listeners; persistence/HTTP suites do not.
      auto-startup: false
outbox:
  # Delivery integration tests invoke the real poller explicitly.
  initial-delay-ms: 3600000
