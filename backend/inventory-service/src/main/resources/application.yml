spring:
  application:
    name: inventory-service
  jpa:
    open-in-view: false
  datasource:
    hikari:
      maximum-pool-size: ${DB_POOL_MAX_SIZE:10}
      minimum-idle: ${DB_POOL_MIN_IDLE:2}
      connection-timeout: ${DB_CONNECTION_TIMEOUT_MS:3000}
  threads:
    virtual:
      enabled: true
  autoconfigure:
    # Secure HTTP only. spring-grpc auto-secures the gRPC server once spring-security is present
    # (every call → UNAUTHENTICATED); gRPC here is internal and protected by the NetworkPolicy
    # (ingress = order pod only), so disable gRPC-layer security.
    exclude:
      - org.springframework.boot.grpc.server.autoconfigure.security.GrpcServerSecurityAutoConfiguration
      - org.springframework.boot.grpc.server.autoconfigure.security.GrpcServerOAuth2ResourceServerAutoConfiguration
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${KEYCLOAK_ISSUER_URI:http://localhost:8180/realms/robomart}
          audiences: ${KEYCLOAK_AUDIENCE:robomart-api}
          jwk-set-uri: ${KEYCLOAK_JWK_SET_URI:http://localhost:8180/realms/robomart/protocol/openid-connect/certs}
  http:
    serviceclient:
      inventory-order-status:
        base-url: ${ORDER_SERVICE_URL:http://localhost:8083}
        connect-timeout: 1s
        read-timeout: 2s
  flyway:
    enabled: true
    locations: classpath:db/migration
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:29092}
    properties:
      schema.registry.url: ${SCHEMA_REGISTRY_URL:http://localhost:8085}
      http.connect.timeout.ms: 1000
      http.read.timeout.ms: 5000
      max.retries: 0
    producer:
      acks: all
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: io.confluent.kafka.serializers.KafkaAvroSerializer
      properties:
        auto.register.schemas: true
        max.block.ms: 1000
        request.timeout.ms: 10000
        delivery.timeout.ms: 30000
    consumer:
      enable-auto-commit: false
      auto-offset-reset: earliest
      max-poll-records: 10
      key-deserializer: org.springframework.kafka.support.serializer.ErrorHandlingDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.ErrorHandlingDeserializer
      properties:
        spring.deserializer.key.delegate.class: org.apache.kafka.common.serialization.StringDeserializer
        spring.deserializer.value.delegate.class: io.confluent.kafka.serializers.KafkaAvroDeserializer
        specific.avro.reader: true
        group.protocol: ${KAFKA_GROUP_PROTOCOL:classic}
        max.poll.interval.ms: 600000
    admin:
      operation-timeout: 5s
      auto-create: ${spring.kafka.listener.auto-startup:true}
    template:
      observation-enabled: true
    listener:
      observation-enabled: true
  grpc:
    server:
      port: 9094
  lifecycle:
    timeout-per-shutdown-phase: 25s

logging:
  structured:
    format:
      console: ${LOGGING_STRUCTURED_FORMAT_CONSOLE:ecs}

server:
  port: 8084
  shutdown: graceful

management:
  tracing:
    baggage:
      remote-fields: correlationId,X-Correlation-Id
      correlation:
        fields: correlationId,X-Correlation-Id
    sampling:
      probability: ${TRACING_SAMPLE_RATE:1.0}
  opentelemetry:
    tracing:
      export:
        otlp:
          endpoint: ${MANAGEMENT_OPENTELEMETRY_TRACING_EXPORT_OTLP_ENDPOINT:http://localhost:4318/v1/traces}
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  health:
    probes:
      enabled: true
  endpoint:
    health:
      show-details: when-authorized
      group:
        liveness:
          include: livenessState
        readiness:
          include: readinessState,db,kafka
  metrics:
    distribution:
      percentiles-histogram:
        "[http.server.requests]": true
      percentiles:
        "[http.server.requests]": 0.5,0.95,0.99

---
spring:
  config:
    activate:
      on-profile: dev
  datasource:
    url: jdbc:postgresql://localhost:5435/inventory_db
    username: robomart
    password: robomart
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        format_sql: true

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  metrics:
    distribution:
      percentiles:
        "[http.server.requests]": 0.95

---
spring:
  config:
    activate:
      on-profile: demo
  flyway:
    locations: classpath:db/migration,classpath:db/seed

---
spring:
  config:
    activate:
      on-profile: test
  jpa:
    hibernate:
      ddl-auto: validate
  flyway:
    locations: classpath:db/migration,classpath:db/seed

robomart:
  inventory:
    consumer-enabled: false
    expiry-enabled: false

management:
  endpoint:
    health:
      # This profile intentionally disables Kafka listeners in PostgreSQL-only tests.
      validate-group-membership: false

---
spring:
  config:
    activate:
      on-profile: test
server:
  shutdown: immediate
management:
  otlp:
    metrics:
      export:
        enabled: false

outbox:
  # Persistence tests invoke the real poller explicitly; unrelated contexts must not publish in the background.
  initial-delay-ms: 3600000
