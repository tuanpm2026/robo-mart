spring:
  application:
    name: inventory-service
  profiles:
    active: dev
  autoconfigure:
    # Secure HTTP only. spring-grpc auto-secures the gRPC server once spring-security is present
    # (every call → UNAUTHENTICATED); gRPC here is internal and protected by the NetworkPolicy
    # (ingress = order pod only), so disable gRPC-layer security.
    exclude:
      - org.springframework.boot.grpc.server.autoconfigure.security.GrpcServerSecurityAutoConfiguration
      - org.springframework.boot.grpc.server.autoconfigure.security.GrpcServerOAuth2ResourceServerAutoConfiguration
  security:
    oauth2:
      resourceserver:
        jwt:
          jwk-set-uri: ${KEYCLOAK_JWK_SET_URI:http://localhost:8180/realms/robomart/protocol/openid-connect/certs}
  http:
    serviceclient:
      inventory-order-status:
        base-url: ${ORDER_SERVICE_URL:http://localhost:8083}
        connect-timeout: 1s
        read-timeout: 2s
  flyway:
    enabled: true
    locations: classpath:db/migration
  kafka:
    bootstrap-servers: localhost:29092
    properties:
      schema.registry.url: http://localhost:8085
    producer:
      properties:
        interceptor.classes: com.robomart.common.kafka.CorrelationIdKafkaProducerInterceptor
    consumer:
      properties:
        interceptor.classes: com.robomart.common.kafka.CorrelationIdKafkaConsumerInterceptor
    template:
      observation-enabled: true
    listener:
      observation-enabled: true
  grpc:
    server:
      port: 9094
  lifecycle:
    timeout-per-shutdown-phase: 25s

server:
  port: 8084
  shutdown: graceful

management:
  tracing:
    sampling:
      probability: ${TRACING_SAMPLE_RATE:1.0}
  opentelemetry:
    tracing:
      export:
        otlp:
          endpoint: ${MANAGEMENT_OPENTELEMETRY_TRACING_EXPORT_OTLP_ENDPOINT:http://localhost:4318/v1/traces}
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  health:
    probes:
      enabled: true
  endpoint:
    health:
      show-details: when-authorized
      group:
        liveness:
          include: livenessState
        readiness:
          include: readinessState,db,kafka
  metrics:
    distribution:
      percentiles-histogram:
        "[http.server.requests]": true
      percentiles:
        "[http.server.requests]": 0.5,0.95,0.99

---
spring:
  config:
    activate:
      on-profile: dev
  datasource:
    url: jdbc:postgresql://localhost:5435/inventory_db
    username: robomart
    password: robomart
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        format_sql: true

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  metrics:
    distribution:
      percentiles:
        "[http.server.requests]": 0.95

---
spring:
  config:
    activate:
      on-profile: demo
  flyway:
    locations: classpath:db/migration,classpath:db/seed

---
spring:
  config:
    activate:
      on-profile: test
  jpa:
    hibernate:
      ddl-auto: validate
  flyway:
    locations: classpath:db/migration,classpath:db/seed

robomart:
  inventory:
    consumer-enabled: false
    expiry-enabled: false

management:
  endpoint:
    health:
      # This profile intentionally disables Kafka listeners in PostgreSQL-only tests.
      validate-group-membership: false
