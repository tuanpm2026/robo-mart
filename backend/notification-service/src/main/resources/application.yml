spring:
  application:
    name: notification-service
  datasource:
    hikari:
      maximum-pool-size: ${DB_POOL_MAX_SIZE:10}
      minimum-idle: ${DB_POOL_MIN_IDLE:2}
      connection-timeout: ${DB_CONNECTION_TIMEOUT_MS:3000}
  threads:
    virtual:
      enabled: true
  flyway:
    enabled: true
    locations: classpath:db/migration
  jpa:
    open-in-view: false
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:29092}
    properties:
      schema.registry.url: ${SCHEMA_REGISTRY_URL:http://localhost:8085}
      http.connect.timeout.ms: 1000
      http.read.timeout.ms: 5000
      max.retries: 0
    producer:
      acks: all
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: io.confluent.kafka.serializers.KafkaAvroSerializer
      properties:
        auto.register.schemas: true
        max.block.ms: 1000
        request.timeout.ms: 10000
        delivery.timeout.ms: 30000
    consumer:
      enable-auto-commit: false
      auto-offset-reset: earliest
      max-poll-records: 10
      key-deserializer: com.robomart.notification.kafka.RawKeyDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.ErrorHandlingDeserializer
      properties:
        spring.deserializer.key.delegate.class: org.apache.kafka.common.serialization.StringDeserializer
        spring.deserializer.value.delegate.class: com.robomart.notification.kafka.RawAvroDeserializer
        specific.avro.reader: true
        max.poll.interval.ms: 600000
    admin:
      operation-timeout: 5s
      auto-create: ${spring.kafka.listener.auto-startup:true}
    template:
      observation-enabled: true
    listener:
      observation-enabled: true
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${KEYCLOAK_ISSUER_URI:http://localhost:8180/realms/robomart}
          audiences: ${KEYCLOAK_AUDIENCE:robomart-api}
          jwk-set-uri: ${KEYCLOAK_JWK_SET_URI:http://localhost:8180/realms/robomart/protocol/openid-connect/certs}
  lifecycle:
    timeout-per-shutdown-phase: 25s

logging:
  structured:
    format:
      console: ${LOGGING_STRUCTURED_FORMAT_CONSOLE:ecs}

server:
  port: 8087
  shutdown: graceful

management:
  tracing:
    baggage:
      remote-fields: correlationId,X-Correlation-Id
      correlation:
        fields: correlationId,X-Correlation-Id
    sampling:
      probability: ${TRACING_SAMPLE_RATE:1.0}
  opentelemetry:
    tracing:
      export:
        otlp:
          endpoint: ${MANAGEMENT_OPENTELEMETRY_TRACING_EXPORT_OTLP_ENDPOINT:http://localhost:4318/v1/traces}
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  health:
    probes:
      enabled: true
  endpoint:
    health:
      show-details: when-authorized
      group:
        liveness:
          include: livenessState
        readiness:
          include: readinessState,db,kafka
  metrics:
    distribution:
      percentiles-histogram:
        "[http.server.requests]": true
      percentiles:
        "[http.server.requests]": 0.5,0.95,0.99

notification:
  order-service:
    url: ${ORDER_SERVICE_URL:http://localhost:8083}
  product-service:
    url: ${PRODUCT_SERVICE_URL:http://localhost:8081}
  cart-service:
    url: ${CART_SERVICE_URL:http://localhost:8082}
  inventory-service:
    url: ${INVENTORY_SERVICE_URL:http://localhost:8084}
  payment-service:
    url: ${PAYMENT_SERVICE_URL:http://localhost:8086}
  notification-self:
    url: ${NOTIFICATION_SERVICE_URL:http://localhost:8087}
  api-gateway:
    url: ${API_GATEWAY_URL:http://localhost:8080}
  admin-email: ${ADMIN_EMAIL:admin@robomart.local}
  email:
    # Only 'mock' (log metadata, no delivery) exists; any other value fails startup.
    provider: ${NOTIFICATION_EMAIL_PROVIDER:mock}
    # A PENDING delivery claim older than this is assumed abandoned and may be re-claimed.
    claim-timeout: ${NOTIFICATION_EMAIL_CLAIM_TIMEOUT:PT2M}
  reconciliation:
    cron: "0 0 2 * * *"
    payment-cron: "0 30 2 * * *"
    inventory-threshold-percent: 1.0
    inventory-threshold-absolute: 5
    payment-threshold-percent: 1.0

---
spring:
  config:
    activate:
      on-profile: dev
  datasource:
    url: jdbc:postgresql://localhost:5437/notification_db
    username: ${DB_USER:postgres}
    password: ${DB_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        format_sql: true

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  metrics:
    distribution:
      percentiles:
        "[http.server.requests]": 0.95

---
spring:
  config:
    activate:
      on-profile: test
  jpa:
    hibernate:
      ddl-auto: validate
  flyway:
    locations: classpath:db/migration
  security:
    oauth2:
      resourceserver:
        jwt:
          jwk-set-uri: http://localhost:8180/realms/robomart/protocol/openid-connect/certs

management:
  endpoint:
    health:
      # Test context does not register the 'kafka' health contributor referenced by the
      # readiness group; skip group-membership validation so the context starts (matches
      # the shared @IntegrationTest meta-annotation used by other services).
      validate-group-membership: false

---
spring:
  http:
    serviceclient:
      notification-order:
        base-url: ${notification.order-service.url}
        connect-timeout: 1s
        read-timeout: 2s
      notification-inventory:
        base-url: ${notification.inventory-service.url}
        connect-timeout: 1s
        read-timeout: 2s
      notification-payment:
        base-url: ${notification.payment-service.url}
        connect-timeout: 1s
        read-timeout: 2s
      notification-product:
        base-url: ${notification.product-service.url}
        connect-timeout: 1s
        read-timeout: 2s
notification:
  service-auth:
    enabled: ${NOTIFICATION_SERVICE_AUTH_ENABLED:true}
