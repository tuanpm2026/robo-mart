spring:
  application:
    name: api-gateway

  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: http://localhost:8180/realms/robomart

  data:
    redis:
      host: ${SPRING_DATA_REDIS_HOST:localhost}
      port: ${SPRING_DATA_REDIS_PORT:6379}

  cloud:
    gateway:
      # Spring Cloud Gateway 5 reads only the server.webflux prefix; the legacy
      # spring.cloud.gateway.* names are silently ignored.
      server:
        webflux:
          globalcors:
            add-to-simple-url-handler-mapping: true
          default-filters:
            - DedupeResponseHeader=Access-Control-Allow-Origin Access-Control-Allow-Credentials, RETAIN_FIRST
          httpclient:
            connect-timeout: 2000  # ms
            # Checkout runs the order saga synchronously (inventory + payment, ~20s worst case).
            response-timeout: 30s

  lifecycle:
    timeout-per-shutdown-phase: 25s

server:
  forward-headers-strategy: none
  port: 8080
  shutdown: graceful

# Downstream service URIs
gateway:
  services:
    product-service: http://localhost:8081
    cart-service: http://localhost:8082
    order-service: http://localhost:8083
    inventory-service: http://localhost:8084
    payment-service: http://localhost:8086
    notification-service: http://localhost:8087
  cors:
    customer-origin: ${CORS_CUSTOMER_ORIGIN:http://localhost:5173}
    admin-origin: ${CORS_ADMIN_ORIGIN:http://localhost:5174}
  # Rate limit configuration (AC3: configurable per endpoint)
  rate-limit:
    authenticated:
      replenish-rate: 2        # tokens/sec → ~120 req/min sustained, burst up to 100 immediately
      burst-capacity: 100      # max burst
    anonymous:
      replenish-rate: 1        # tokens/sec
      burst-capacity: 60       # max tokens in bucket
      requested-tokens: 3      # 60 tokens/min ÷ 3 = 20 req/min

# Actuator — served on a separate, cluster-internal management port so that the public
# listener (8080, fronted by the LoadBalancer/Ingress) exposes no actuator endpoints.
management:
  server:
    port: 8090
  tracing:
    sampling:
      probability: ${TRACING_SAMPLE_RATE:1.0}
  opentelemetry:
    tracing:
      export:
        otlp:
          endpoint: ${MANAGEMENT_OPENTELEMETRY_TRACING_EXPORT_OTLP_ENDPOINT:http://localhost:4318/v1/traces}
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  health:
    probes:
      enabled: true
  endpoint:
    health:
      show-details: when-authorized
      group:
        liveness:
          include: livenessState
        readiness:
          include: readinessState,redis
    # Route-write operations (POST /actuator/gateway/routes/{id}) would allow traffic hijacking.
    gateway:
      access: none
  metrics:
    distribution:
      percentiles-histogram:
        "[http.server.requests]": true
      percentiles:
        "[http.server.requests]": 0.5,0.95,0.99
