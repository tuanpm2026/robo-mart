name: Schema Compatibility

on:
  push:
    branches: [ main ]
    paths:
      - 'backend/proto/**'
      - 'backend/events/**'
      - '.github/workflows/schema-compatibility.yml'
  pull_request:
    branches: [ main ]
    paths:
      - 'backend/proto/**'
      - 'backend/events/**'
      - '.github/workflows/schema-compatibility.yml'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  proto-compatibility:
    name: Protobuf Backward Compatibility (buf)
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          # Full history so `buf breaking` can resolve the `main` ref locally if needed.
          fetch-depth: 0

      - name: Set up Java 21
        uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'maven'

      - name: Install buf
        uses: bufbuild/buf-setup-action@v1

      # Style + naming lint. The buf.yaml STANDARD ruleset excepts only the three
      # structural rules (directory/version layout) that conflict with this repo's
      # intentional flat proto layout — all naming/style/comment rules are enforced.
      - name: buf lint
        working-directory: backend/proto
        run: buf lint

      # Wire backward-compatibility: compare this PR's protos against main's protos.
      # Uses the remote URL form so it never depends on which refs are present in the
      # shallow PR checkout, and is unaffected by main's buf.yaml (breaking checks read
      # only proto descriptors, not the lint config).
      - name: buf breaking (backward compatibility against main)
        if: github.event_name == 'pull_request'
        run: |
          buf breaking backend/proto \
            --against "https://github.com/${{ github.repository }}.git#branch=main,subdir=backend/proto"

      - name: Maven build proto module (runs buf lint via build)
        working-directory: backend
        run: ./mvnw install -pl :proto -DskipBufLint=false -DskipTests

  avro-compatibility:
    name: Avro Schema Compatibility (Schema Registry)
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Java 21
        uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'maven'

      # AvroSchemaCompatibilityIT self-provisions a real Kafka + Confluent Schema
      # Registry via Testcontainers (Docker is preinstalled on the runner), then
      # registers all 13 Avro schemas and verifies each is accepted and backward-
      # compatible with its registered version. No GitHub `services:` containers are
      # needed — the previous zookeeper/kafka/schema-registry services were unused by
      # the test and their kafka health check was misconfigured (probed :9092 while the
      # broker only advertised :29092), which made this job fail before the test ran.
      - name: Build events module + deps (skip tests)
        working-directory: backend
        run: ./mvnw install -pl :events -am -DskipTests

      - name: Verify Avro schema compatibility (Testcontainers IT)
        working-directory: backend
        run: ./mvnw verify -pl :events
        env:
          TESTCONTAINERS_RYUK_DISABLED: "true"

      - name: Publish Test Results (events)
        uses: dorny/test-reporter@v3
        if: always()
        with:
          name: Avro Schema Compatibility Results
          path: backend/events/target/failsafe-reports/TEST-*.xml,backend/events/target/surefire-reports/TEST-*.xml
          reporter: java-junit
          fail-on-empty: false
