name: Security Scan

# Supply-chain & static security scanning. Findings are uploaded to the repo's
# "Security → Code scanning" tab (SARIF). Scans are report-only by default
# (exit-code 0) so a backlog of pre-existing findings does not block PRs on day
# one; flip Trivy's exit-code (see below) once the backlog is triaged to make it
# a hard gate.

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  schedule:
    # Weekly re-scan (Mondays 06:23 UTC) catches newly-disclosed CVEs in pinned deps.
    - cron: '23 6 * * 1'

permissions:
  contents: read
  security-events: write   # required to upload SARIF to code scanning

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ---------------------------------------------------------------------------
  # Trivy — dependency CVEs (Maven + npm), hard-coded secrets, and IaC/Dockerfile
  # misconfigurations across the whole repo, in a single filesystem scan.
  # ---------------------------------------------------------------------------
  trivy:
    name: Trivy (deps + secrets + IaC)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Java 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: maven

      - name: Package backend for transitive dependency scan
        working-directory: backend
        run: ./mvnw -B -ntp package -DskipTests -DskipITs -DskipE2ETests

      - name: Install Trivy
        uses: aquasecurity/setup-trivy@e07451d2e059ed86c2870430ea286b3a9e0bf241
        with:
          version: v0.76.2

      - name: Trivy filesystem scan (SARIF)
        id: trivy-scan
        run: |
          trivy fs . \
            --scanners vuln,secret,misconfig \
            --severity CRITICAL,HIGH,MEDIUM \
            --format sarif \
            --output trivy-results.sarif \
            --exit-code 0 \
            --include-dev-deps \
            --offline-scan \
            --ignorefile .trivyignore.yaml \
            --no-progress
        # --ignorefile: documented, path-scoped acceptances for the handful of
        # findings that are false positives or not-applicable policy rules (see
        # .trivyignore.yaml). Trivy auto-loads only the plain .trivyignore, so the
        # .yaml variant must be passed explicitly.
        # --offline-scan: use the npm lockfile, Maven cache and packaged JARs for
        # dependency discovery. Trivy still downloads its advisory databases.
        env:
          TRIVY_CACHE_DIR: ${{ runner.temp }}/trivy-cache

      - name: Upload Trivy SARIF
        uses: github/codeql-action/upload-sarif@1bd86f2fdb4b86187fa4059f16f31a3202acc9ea # v4.39.4
        if: steps.trivy-scan.outcome == 'success'
        with:
          sarif_file: trivy-results.sarif
          category: trivy-fs

  # ---------------------------------------------------------------------------
  # CodeQL — static analysis (SAST) for the Java backend and the TS/JS frontend.
  # build-mode: none analyses source directly, so no Maven/npm build is required.
  # ---------------------------------------------------------------------------
  codeql:
    name: CodeQL (${{ matrix.language }})
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - language: java-kotlin
            build-mode: none
          - language: javascript-typescript
            build-mode: none
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Initialize CodeQL
        uses: github/codeql-action/init@1bd86f2fdb4b86187fa4059f16f31a3202acc9ea # v4.39.4
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.build-mode }}
          queries: security-extended

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@1bd86f2fdb4b86187fa4059f16f31a3202acc9ea # v4.39.4
        with:
          category: "/language:${{ matrix.language }}"
