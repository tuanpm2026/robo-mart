name: CD Deploy

on:
  workflow_run:
    workflows: [ "Backend CI" ]
    types: [ completed ]
    branches: [ main ]
  workflow_dispatch:
    inputs:
      sha:
        description: 'Full main commit SHA with successful Backend CI (defaults to main HEAD)'
        required: false
        default: ''

concurrency:
  group: deploy-main
  cancel-in-progress: false

jobs:
  resolve:
    name: Resolve CI-approved release
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    permissions:
      contents: read
      actions: read
      checks: read
    outputs:
      sha: ${{ steps.release.outputs.sha }}
      tag: ${{ steps.release.outputs.tag }}
      prefix: ${{ steps.release.outputs.prefix }}
      ci_run_id: ${{ steps.release.outputs.ci_run_id }}
    steps:
      - name: Checkout trusted release policy
        uses: actions/checkout@v4
        with:
          ref: ${{ github.workflow_sha }}
          persist-credentials: false
      - name: Resolve and verify source commit
        id: release
        uses: actions/github-script@v7
        env:
          REQUESTED_SHA: ${{ inputs.sha }}
        with:
          script: |
            const { resolveRelease } = require('./infra/ci/scripts/release-policy.cjs');
            const release = await resolveRelease({ github, context, kind: 'backend', requestedSha: process.env.REQUESTED_SHA });
            core.setOutput('sha', release.sha);
            core.setOutput('tag', release.tag);
            core.setOutput('prefix', release.prefix);
            core.setOutput('ci_run_id', release.ciRunId);
            core.info(`Approved source ${release.sha} from CI run ${release.ciRunId}`);

  build-and-push:
    name: Build & Push Docker Images
    needs: resolve
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    permissions:
      contents: read
      packages: write

    strategy:
      matrix:
        service:
          - name: product-service
            port: 8081
          - name: cart-service
            port: 8082
          - name: order-service
            port: 8083
          - name: inventory-service
            port: 8084
          - name: payment-service
            port: 8086
          - name: notification-service
            port: 8087
          - name: api-gateway
            port: 8080

    steps:
      - name: Checkout trusted release policy
        uses: actions/checkout@v4
        with:
          ref: ${{ github.workflow_sha }}
          persist-credentials: false
      - name: Preserve release policy outside the source checkout
        run: install -m 0644 infra/ci/scripts/release-policy.cjs "${RUNNER_TEMP}/release-policy.cjs"
      - name: Checkout exact CI-approved source
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.resolve.outputs.sha }}
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push ${{ matrix.service.name }}
        id: image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: infra/docker/${{ matrix.service.name }}/Dockerfile
          push: true
          tags: ${{ needs.resolve.outputs.prefix }}/${{ matrix.service.name }}:${{ needs.resolve.outputs.tag }}
          labels: |
            org.opencontainers.image.revision=${{ needs.resolve.outputs.sha }}
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
          cache-from: type=gha,scope=backend-${{ matrix.service.name }}
          cache-to: type=gha,scope=backend-${{ matrix.service.name }},mode=max
      - name: Record image digest and source
        env:
          RELEASE_SHA: ${{ needs.resolve.outputs.sha }}
          RELEASE_IMAGE_NAME: ${{ matrix.service.name }}
          RELEASE_IMAGE_DIGEST: ${{ steps.image.outputs.digest }}
        run: node "${RUNNER_TEMP}/release-policy.cjs" record backend "${RUNNER_TEMP}/release-images"
      - name: Upload image provenance
        uses: actions/upload-artifact@v4
        with:
          name: release-image-${{ matrix.service.name }}
          path: ${{ runner.temp }}/release-images/*.json
          if-no-files-found: error
          overwrite: true
          retention-days: 7

  update-image-tags:
    name: Update verified image digests (GitOps)
    needs: [resolve, build-and-push]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Checkout trusted release policy
        uses: actions/checkout@v4
        with:
          ref: ${{ github.workflow_sha }}
          persist-credentials: false
      - name: Preserve release policy outside the GitOps checkout
        run: install -m 0644 infra/ci/scripts/release-policy.cjs "${RUNNER_TEMP}/release-policy.cjs"
      - name: Checkout current GitOps branch
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Download this run's image records
        uses: actions/download-artifact@v4
        with:
          pattern: release-image-*
          path: ${{ runner.temp }}/release-images
          merge-multiple: true
      - name: Install kustomize
        uses: imranismail/setup-kustomize@v2
        with:
          kustomize-version: '5.4.3'
      - name: Publish only current CI-approved image digests
        env:
          RELEASE_SHA: ${{ needs.resolve.outputs.sha }}
        run: node "${RUNNER_TEMP}/release-policy.cjs" publish backend "${RUNNER_TEMP}/release-images"
