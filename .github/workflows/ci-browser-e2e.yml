name: Customer Browser E2E

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - "backend/**"
      - "frontend/**"
      - "infra/e2e/**"
      - "infra/docker/docker-compose.e2e.yml"
      - "infra/docker/minio/**"
      - "infra/docker/keycloak/**"
      - ".github/workflows/ci-browser-e2e.yml"

concurrency:
  group: browser-e2e-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  customer-browser:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: "25"
          distribution: temurin
          cache: maven
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install frontend dependencies and Chromium
        working-directory: frontend
        run: |
          npm ci
          npx playwright install --with-deps chromium
      - name: Package backend applications (tests run in Backend CI)
        working-directory: backend
        run: ./mvnw -B -ntp install -DskipTests -DskipITs -DskipE2ETests
      - name: Build and start isolated stack
        run: |
          infra/e2e/stack.sh build
          infra/e2e/stack.sh up
      - name: Check browser checkout and authentication recovery
        working-directory: frontend
        run: npm run test:e2e --workspace=customer-website
      - name: Check Saga durability and automatic recovery
        run: infra/e2e/stack.sh test
      - name: Capture stack diagnostics
        if: failure()
        run: infra/e2e/stack.sh logs > browser-stack.log 2>&1
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: customer-browser-e2e
          path: |
            frontend/customer-website/playwright-report/
            frontend/customer-website/test-results/
            browser-stack.log
            backend/e2e-tests/target/failsafe-reports/
          retention-days: 7
      - name: Stop isolated stack (retain volumes)
        if: always()
        run: infra/e2e/stack.sh down
