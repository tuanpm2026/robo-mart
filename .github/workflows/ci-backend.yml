name: Backend CI

on:
  push:
    branches: [ main ]
    paths:
      - 'backend/**'
      - '.github/workflows/ci-backend.yml'
  pull_request:
    branches: [ main ]
    paths:
      - 'backend/**'
      - '.github/workflows/ci-backend.yml'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ---------------------------------------------------------------------------
  # Job 1 — compile everything, run Checkstyle, and run the coverage gate for
  # the modules that have NO Testcontainers integration tests (libs + gateway).
  # Fast, no Docker. Gates the matrix below (build must compile cleanly first).
  # ---------------------------------------------------------------------------
  build:
    name: Build, Checkstyle & Unit-only Coverage
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      checks: write
      pull-requests: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Java 21
        uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'maven'

      # Compile + install every module (no tests) so downstream resolves from ~/.m2.
      - name: Build all modules (skip tests)
        working-directory: backend
        run: ./mvnw install -T 1C -DskipTests -DskipITs -DskipE2ETests

      - name: Checkstyle
        working-directory: backend
        run: ./mvnw checkstyle:check

      # Unit-only modules: no Testcontainers, so `verify` here just runs their unit
      # tests + the JaCoCo gate (BUNDLE LINE >= 0.80). The IT-bearing services run
      # in the parallel matrix job below, each isolated on its own runner.
      - name: Unit-only modules — tests + coverage gate
        working-directory: backend
        run: ./mvnw verify -pl :common-lib,:security-lib,:proto,:api-gateway -DskipITs -DskipE2ETests

      # OpenAPI drift detection (no-op until baselines are committed under docs/api).
      - name: OpenAPI Drift Detection
        run: |
          if [ -d "docs/api" ] && ls docs/api/*.json > /dev/null 2>&1; then
            bash infra/ci/scripts/check-openapi-drift.sh
          else
            echo "No API baselines found — skipping drift check"
          fi

      - name: Publish Test Results (unit-only modules)
        uses: dorny/test-reporter@v3
        if: always()
        with:
          name: Backend Test Results - libs+gateway
          path: backend/**/target/surefire-reports/TEST-*.xml
          reporter: java-junit
          fail-on-empty: false

  # ---------------------------------------------------------------------------
  # Job 2 — per-service integration tests, each on its OWN isolated runner so
  # the heavy Testcontainers (Elasticsearch / Kafka / Postgres / Redis) of one
  # service never contend with another's. Runs in parallel (fail-fast: false).
  #
  # Each job: (1) build this module + its deps with NO tests (so -am does not run
  # upstream modules' own ITs — e.g. the events Kafka+Schema-Registry IT would
  # otherwise re-run inside every service that depends on it), then (2) `verify`
  # ONLY this module → its unit + IT + JaCoCo gate, resolving deps from ~/.m2.
  # ---------------------------------------------------------------------------
  integration-tests:
    name: IT - ${{ matrix.module }}
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
      checks: write
      pull-requests: write
    strategy:
      fail-fast: false
      matrix:
        module:
          - product-service      # Elasticsearch + Redis
          - cart-service         # Redis
          - order-service        # Postgres + Kafka + gRPC (also runs its Pact provider IT)
          - inventory-service    # Postgres + Redis
          - payment-service      # Postgres
          - notification-service # Postgres + Kafka
          - events               # Kafka + Schema Registry
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Java 21
        uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'maven'

      # Build this module + its dependency subtree, without running any tests.
      - name: Build ${{ matrix.module }} + deps (skip tests)
        working-directory: backend
        run: ./mvnw install -pl :${{ matrix.module }} -am -DskipTests -DskipITs -DskipE2ETests

      # Verify ONLY this module: unit + integration tests + JaCoCo gate. No -am, so
      # upstream modules' tests/ITs do not re-run; deps resolve from ~/.m2 above.
      - name: Verify ${{ matrix.module }} (unit + IT + coverage gate)
        working-directory: backend
        run: ./mvnw verify -pl :${{ matrix.module }} -DskipE2ETests
        env:
          TESTCONTAINERS_RYUK_DISABLED: "true"
          # product-service & order-service run their Pact provider ITs here.
          PACT_BROKER_URL: ${{ vars.PACT_BROKER_URL || '' }}

      - name: Publish Test Results (${{ matrix.module }})
        uses: dorny/test-reporter@v3
        if: always()
        with:
          name: Backend Test Results - ${{ matrix.module }}
          path: backend/${{ matrix.module }}/target/surefire-reports/TEST-*.xml,backend/${{ matrix.module }}/target/failsafe-reports/TEST-*.xml
          reporter: java-junit
          fail-on-empty: false

      - name: Upload Test Reports (${{ matrix.module }})
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: backend-test-reports-${{ matrix.module }}
          path: |
            backend/${{ matrix.module }}/target/surefire-reports/
            backend/${{ matrix.module }}/target/failsafe-reports/
          retention-days: 7
