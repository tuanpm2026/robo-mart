# Cluster-internal actuator endpoint for api-gateway (health, Prometheus scrape,
# notification-service health aggregator). Deliberately a separate ClusterIP Service:
# the public api-gateway Service (LoadBalancer / Ingress backend) only exposes 8080.
apiVersion: v1
kind: Service
metadata:
  name: api-gateway-management
  namespace: robomart
spec:
  type: ClusterIP
  selector:
    app: api-gateway
  ports:
  - port: 8090
    targetPort: management
    protocol: TCP
    name: management
