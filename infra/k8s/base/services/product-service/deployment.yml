apiVersion: apps/v1
kind: Deployment
metadata:
  name: product-service
  namespace: robomart
  labels:
    app: product-service
spec:
  replicas: 2
  strategy:
    # Pre-V8 outbox publishers ignore delivery leases; stop them before migrating.
    type: Recreate
  selector:
    matchLabels:
      app: product-service
  template:
    metadata:
      labels:
        app: product-service
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1001
        runAsGroup: 1001
        fsGroup: 1001
        seccompProfile:
          type: RuntimeDefault
      containers:
      - name: product-service
        image: ghcr.io/robomart/product-service:latest
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop:
            - ALL
        ports:
        - containerPort: 8081
          name: http
        resources:
          requests:
            memory: "256Mi"
            cpu: "250m"
          limits:
            memory: "512Mi"
            cpu: "500m"
        envFrom:
        - configMapRef:
            name: robomart-config
        - secretRef:
            name: product-db-secret
        - secretRef:
            name: product-s3-secret
        env:
        - name: ROBOMART_PRODUCT_IMAGE_BASE_URL
          value: "https://api.tuanpm.xyz"
        - name: ROBOMART_PRODUCT_IMAGE_STORAGE_PATH
          value: /migration/images
        - name: PRODUCT_SEARCH_INITIALIZE_INDEX
          value: "true"
        - name: PRODUCT_KAFKA_DLT_REPLICATION_FACTOR
          value: "1"
        volumeMounts:
        - name: tmp
          mountPath: /tmp
        - name: product-images
          mountPath: /migration/images
          readOnly: true
        livenessProbe:
          httpGet:
            path: /actuator/health/liveness
            port: 8081
          initialDelaySeconds: 90
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 6
        readinessProbe:
          httpGet:
            path: /actuator/health/readiness
            port: 8081
          initialDelaySeconds: 60
          periodSeconds: 5
          timeoutSeconds: 3
          failureThreshold: 6
      volumes:
      - name: tmp
        emptyDir: {}
      - name: product-images
        persistentVolumeClaim:
          claimName: product-images
