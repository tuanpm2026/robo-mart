apiVersion: apps/v1
kind: Deployment
metadata:
  name: payment-service
  namespace: robomart
  labels:
    app: payment-service
spec:
  replicas: 2
  strategy:
    # V5 retires the dead outbox table; stop old writers before applying the new schema.
    type: Recreate
  selector:
    matchLabels:
      app: payment-service
  template:
    metadata:
      labels:
        app: payment-service
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1001
        runAsGroup: 1001
        fsGroup: 1001
        seccompProfile:
          type: RuntimeDefault
      containers:
      - name: payment-service
        image: ghcr.io/robomart/payment-service:latest
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop:
            - ALL
        ports:
        - containerPort: 8086
          name: http
        - containerPort: 9095
          name: grpc
        resources:
          requests:
            memory: "256Mi"
            cpu: "250m"
          limits:
            memory: "512Mi"
            cpu: "500m"
        envFrom:
        - configMapRef:
            name: robomart-config
        - secretRef:
            name: payment-db-secret
        env:
        - name: MANAGEMENT_ENDPOINT_HEALTH_GROUP_READINESS_INCLUDE
          value: "readinessState,db"
        - name: GRPC_SERVER_PORT
          value: "9095"
        volumeMounts:
        - name: tmp
          mountPath: /tmp
        livenessProbe:
          httpGet:
            path: /actuator/health/liveness
            port: 8086
          initialDelaySeconds: 120
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 6
        readinessProbe:
          httpGet:
            path: /actuator/health/readiness
            port: 8086
          initialDelaySeconds: 90
          periodSeconds: 5
          timeoutSeconds: 3
          failureThreshold: 6
      volumes:
      - name: tmp
        emptyDir: {}
