# K8s Secrets Template — DO NOT commit real passwords
# Apply: kubectl apply -f secrets-template.yml -n robomart
# Each service's datasource credentials
#
# ghcr-pull-secret: required for pulling images from ghcr.io/robomart/* if the
# package becomes private. Generate the .dockerconfigjson value with:
#
#   kubectl create secret docker-registry ghcr-pull-secret \
#     --docker-server=ghcr.io \
#     --docker-username=<github-username> \
#     --docker-password=<github-pat-with-read:packages> \
#     --namespace=robomart \
#     --dry-run=client -o yaml
#
# The default ServiceAccount is patched in serviceaccount.yml to reference this
# secret, so every pod in the namespace inherits the pull credentials without
# editing each deployment.
---
apiVersion: v1
kind: Secret
metadata:
  name: ghcr-pull-secret
  namespace: robomart
type: kubernetes.io/dockerconfigjson
data:
  .dockerconfigjson: REPLACE_ME_BASE64_DOCKERCONFIG
---
apiVersion: v1
kind: Secret
metadata:
  name: product-db-secret
  namespace: robomart
type: Opaque
stringData:
  SPRING_DATASOURCE_URL: "jdbc:postgresql://product-postgres:5432/product_db"
  SPRING_DATASOURCE_USERNAME: "robomart"
  SPRING_DATASOURCE_PASSWORD: "REPLACE_ME"
---
apiVersion: v1
kind: Secret
metadata:
  name: order-db-secret
  namespace: robomart
type: Opaque
stringData:
  SPRING_DATASOURCE_URL: "jdbc:postgresql://order-postgres:5432/order_db"
  SPRING_DATASOURCE_USERNAME: "robomart"
  SPRING_DATASOURCE_PASSWORD: "REPLACE_ME"
---
apiVersion: v1
kind: Secret
metadata:
  name: inventory-db-secret
  namespace: robomart
type: Opaque
stringData:
  SPRING_DATASOURCE_URL: "jdbc:postgresql://inventory-postgres:5432/inventory_db"
  SPRING_DATASOURCE_USERNAME: "robomart"
  SPRING_DATASOURCE_PASSWORD: "REPLACE_ME"
---
apiVersion: v1
kind: Secret
metadata:
  name: payment-db-secret
  namespace: robomart
type: Opaque
stringData:
  SPRING_DATASOURCE_URL: "jdbc:postgresql://payment-postgres:5432/payment_db"
  SPRING_DATASOURCE_USERNAME: "robomart"
  SPRING_DATASOURCE_PASSWORD: "REPLACE_ME"
---
apiVersion: v1
kind: Secret
metadata:
  name: notification-db-secret
  namespace: robomart
type: Opaque
stringData:
  SPRING_DATASOURCE_URL: "jdbc:postgresql://notification-postgres:5432/notification_db"
  SPRING_DATASOURCE_USERNAME: "postgres"
  SPRING_DATASOURCE_PASSWORD: "REPLACE_ME"
  DB_USER: "postgres"
  DB_PASSWORD: "REPLACE_ME"

---
apiVersion: v1
kind: Secret
metadata:
  name: inventory-service-auth
  namespace: robomart
type: Opaque
stringData:
  # Must match the inventory-service confidential client in the live realm.
  client-secret: "REPLACE_ME"

---
apiVersion: v1
kind: Secret
metadata:
  name: notification-service-auth
  namespace: robomart
type: Opaque
stringData:
  client-secret: "REPLACE_ME"

---
# Populate before rollout. Use workload IAM by leaving both key fields empty where supported.
apiVersion: v1
kind: Secret
metadata:
  name: product-s3-secret
  namespace: robomart
type: Opaque
stringData:
  S3_ENDPOINT: "REPLACE_ME_S3_ENDPOINT_OR_EMPTY_FOR_AWS"
  S3_REGION: "REPLACE_ME_REGION"
  S3_BUCKET: "REPLACE_ME_BUCKET"
  S3_PUBLIC_BASE_URL: "REPLACE_ME_PUBLIC_BUCKET_OR_CDN_URL"
  S3_ACCESS_KEY: "REPLACE_ME_OR_EMPTY_FOR_IAM"
  S3_SECRET_KEY: "REPLACE_ME_OR_EMPTY_FOR_IAM"
  S3_PATH_STYLE: "false"
