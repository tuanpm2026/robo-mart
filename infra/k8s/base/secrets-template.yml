kind: Secret
metadata:
  name: order-db-secret
  namespace: robomart
type: Opaque
stringData:
  SPRING_DATASOURCE_URL: "jdbc:postgresql://order-postgres:5432/order_db"
  SPRING_DATASOURCE_USERNAME: "robomart"
  SPRING_DATASOURCE_PASSWORD: "REPLACE_ME"
---
apiVersion: v1
