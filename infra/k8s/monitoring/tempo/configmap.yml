apiVersion: v1
kind: ConfigMap
metadata:
  name: tempo-config
  namespace: monitoring
data:
  tempo.yml: |
    server:
      http_listen_port: 3200

    # Small blocks and serialized flushes fit this single-node demo's memory budget.
    ingester:
      concurrent_flushes: 1
      max_block_bytes: 16777216
      max_block_duration: 5m

    distributor:
      receivers:
        otlp:
          protocols:
            grpc:
              endpoint: "0.0.0.0:4317"
            http:
              endpoint: "0.0.0.0:4318"

    storage:
      trace:
        backend: local
        block:
          parquet_row_group_size_bytes: 5000000
        local:
          path: /var/tempo/traces
