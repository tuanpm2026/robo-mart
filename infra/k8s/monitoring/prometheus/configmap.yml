apiVersion: v1
kind: ConfigMap
metadata:
  name: prometheus-config
  namespace: monitoring
data:
  prometheus.yml: |
    global:
      scrape_interval: 15s

    rule_files:
      - /etc/prometheus/saga-rules.yml

    scrape_configs:
      - job_name: 'spring-boot-services'
        metrics_path: '/actuator/prometheus'
        static_configs:
          - targets:
              - 'api-gateway-management.robomart.svc.cluster.local:8090'
              - 'product-service.robomart.svc.cluster.local:8081'
              - 'cart-service.robomart.svc.cluster.local:8082'
              - 'order-service.robomart.svc.cluster.local:8083'
              - 'inventory-service.robomart.svc.cluster.local:8084'
              - 'payment-service.robomart.svc.cluster.local:8086'
              - 'notification-service.robomart.svc.cluster.local:8087'
              - 'checkout-saga-service.robomart.svc.cluster.local:8091'
  saga-rules.yml: |
    groups:
      - name: checkout-saga
        rules:
          - alert: CheckoutSagaNeedsReview
            expr: saga_workflows_manual > 0
            for: 2m
            labels: {severity: warning}
            annotations:
              summary: "Checkout compensation requires operator review"
          - alert: CheckoutSagaBacklog
            expr: saga_queue_oldest_seconds > 300
            for: 5m
            labels: {severity: warning}
            annotations:
              summary: "Checkout work has remained due for more than five minutes"
