# Grafana admin credential — DO NOT commit a real password.
#
# This file is intentionally NOT listed in monitoring/kustomization.yaml so that
# ArgoCD never applies (or prunes) it. Create the Secret once, out of band,
# before the grafana Deployment starts — the deployment references it via
# secretKeyRef and the pod will not start until it exists.
#
# Recommended (generates a strong random password, never touches git):
#
#   kubectl create secret generic grafana-admin \
#     --namespace=monitoring \
#     --from-literal=admin-password="$(openssl rand -base64 24)"
#
# Or apply this template after replacing the placeholder:
#
#   kubectl apply -f secret-template.yml   # only after editing REPLACE_ME
---
apiVersion: v1
kind: Secret
metadata:
  name: grafana-admin
  namespace: monitoring
type: Opaque
stringData:
  admin-password: "REPLACE_ME"
