apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: robomart
resources:
- ../../base
- demo-object-storage.yaml

# Image tags are updated automatically by CD workflow after each successful build.
# Do not edit the newTag values manually — they are managed by:
#   kustomize edit set image ghcr.io/tuanpm2026/robomart/<service>:<tag>
patches:
- path: patches/single-node-replicas.yaml
- path: patches/backend-rollout-waves.yaml
- path: patches/product-image-storage.yaml
- path: patches/product-image-proxy.yaml
- path: patches/product-image-proxy-service.yaml
  target:
    kind: Service
    name: product-service
    version: v1
- patch: |-
    - op: add
      path: /spec/ingress/0/ports/-
      value: {port: 8088, protocol: TCP}
  target:
    group: networking.k8s.io
    kind: NetworkPolicy
    name: allow-product-ingress
    version: v1

# CD sets the first real Saga digest; do not invent provenance for the previous release.
images:
- digest: sha256:b2bcb1af9d0df6a339899c0223d9c5a1e79ff6f0b5d90789f402cfad5575a803
  name: ghcr.io/robomart/admin-dashboard
  newName: ghcr.io/tuanpm2026/robomart/admin-dashboard
- digest: sha256:f8a61c9ea798f1758a91e6dd976cd339b5feb5fd66a129791b628badb90eb516
  name: ghcr.io/robomart/api-gateway
  newName: ghcr.io/tuanpm2026/robomart/api-gateway
- digest: sha256:b1f88070f672dff95892bca98426bb28b04acd6b26338e7ae20687d915cf8b89
  name: ghcr.io/robomart/cart-service
  newName: ghcr.io/tuanpm2026/robomart/cart-service
- digest: sha256:3d84977dd192c1c9b82a212fe4904deb0a2f9771962c23a0c77ed034ca877d1b
  name: ghcr.io/robomart/checkout-saga-service
  newName: ghcr.io/tuanpm2026/robomart/checkout-saga-service
- digest: sha256:6764399a0f8ee8cd35a1f2fa950bc839de683a9fd87cecef3f4a875db4eead2b
  name: ghcr.io/robomart/customer-website
  newName: ghcr.io/tuanpm2026/robomart/customer-website
- digest: sha256:818a8d387e45c37252862b130cdab3b8d363a0d1325b661d4a8fc332c6989ddb
  name: ghcr.io/robomart/inventory-service
  newName: ghcr.io/tuanpm2026/robomart/inventory-service
- digest: sha256:b36e6af3f9a7385dffb6b1c2a8fd515749fe798b76efcbe436345927bda6c423
