  name: ghcr.io/robomart/product-service
  newName: ghcr.io/tuanpm2026/robomart/product-service

configMapGenerator:
- files:
  - nginx.conf=product-image-proxy.conf
  name: product-image-proxy
  options:
    annotations:
      argocd.argoproj.io/sync-wave: "-3"
