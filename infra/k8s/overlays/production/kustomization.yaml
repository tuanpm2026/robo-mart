apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: robomart
resources:
- ../../base
- demo-object-storage.yaml

# Image tags are updated automatically by CD workflow after each successful build.
# Do not edit the newTag values manually — they are managed by:
#   kustomize edit set image ghcr.io/tuanpm2026/robomart/<service>:<tag>
patches:
- path: patches/single-node-replicas.yaml
- path: patches/product-image-storage.yaml
- path: patches/product-image-proxy.yaml
- path: patches/product-image-proxy-service.yaml
  target:
    kind: Service
    name: product-service
    version: v1
- patch: |-
    - op: add
      path: /spec/ingress/0/ports/-
      value: {port: 8088, protocol: TCP}
  target:
    group: networking.k8s.io
    kind: NetworkPolicy
    name: allow-product-ingress
    version: v1

images:
- digest: sha256:c7b421717a6dac614cfe4181998210d014544786aae2cfd3cf7045ef00145eef
  name: ghcr.io/robomart/admin-dashboard
  newName: ghcr.io/tuanpm2026/robomart/admin-dashboard
- digest: sha256:b6d0afdae79127b6cb3032fddca1df5ace4f5fc0c190a2048f03a3c2bd264517
  name: ghcr.io/robomart/api-gateway
  newName: ghcr.io/tuanpm2026/robomart/api-gateway
- digest: sha256:3d863cf3c6398ee40d93afeeb82b0e71d323bf4e6ac3f0b15be937cbc9899963
  name: ghcr.io/robomart/cart-service
  newName: ghcr.io/tuanpm2026/robomart/cart-service
- digest: sha256:bc2e447177f0d2c7a5cfa29b6f859fd1c8bc6c62d844bd3e2e14c1705cd26fcd
  name: ghcr.io/robomart/customer-website
  newName: ghcr.io/tuanpm2026/robomart/customer-website
- digest: sha256:ea73e5473972c638133b31cec9647b0f961f7e86dd1672d2ab5c5887a881b21c
  name: ghcr.io/robomart/inventory-service
  newName: ghcr.io/tuanpm2026/robomart/inventory-service
- digest: sha256:154c843f045f7937b9acdffa4847582aa7a2b4576f60626d4f1b2a03ae7f3579
  name: ghcr.io/robomart/notification-service
  newName: ghcr.io/tuanpm2026/robomart/notification-service
- digest: sha256:ccecca8cc0467ad3db1fa8e6f4b288ad9abf16fd06bf6cc58b473f31ff59f740
  name: ghcr.io/robomart/order-service
  newName: ghcr.io/tuanpm2026/robomart/order-service
- digest: sha256:a48ee8433cb98a14d4a636565bb57d0051b9cc779169d5e3b23ffeaae971e78a
  name: ghcr.io/robomart/payment-service
  newName: ghcr.io/tuanpm2026/robomart/payment-service
- digest: sha256:ccfb8d25c48bcd6036873d131685e4c08d963a9e893db1526e520964a7de5451
  name: ghcr.io/robomart/product-service
